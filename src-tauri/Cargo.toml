[package]
name = "file-integrity-manager"
version = "1.0.0"
edition = "2021"

[lib]
name = "integrity_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

